name: Azure Static Web Apps CI/CD

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ma-cakr-azure-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - codex/ma-cakr-editorial
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - codex/ma-cakr-editorial

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Generate public pages and prepare deployment
        env:
          SITE_BASE_URL: https://macakr.me
        run: |
          test -n "$SITE_BASE_URL"
          python3 tools/build.py
          mkdir _site
          cp -R index.html styles.css app.js assets tr journal robots.txt sitemap.xml staticwebapp.config.json _site/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_0FBFC1C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "_site" # Generated public files only
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          skip_api_build: true
          production_branch: "codex/ma-cakr-editorial"
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_0FBFC1C10 }}
          action: "close"
